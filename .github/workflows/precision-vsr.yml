name: Precision Temporal VSR (non-generative)

on:
  pull_request:
    paths:
      - 'tools/precision_vsr.py'
      - 'tools/dex_sr_conditions.py'
      - 'tests/test_dex_sr_conditions.py'
      - 'tests/dex-sr-runtime.integration.test.ts'
      - 'server/editor.ts'
      - 'server/service.ts'
      - 'server/dex-sr-planner.ts'
      - 'src/shared/schema.ts'
      - 'src/shared/types.ts'
      - 'tools/requirements-precision-vsr.txt'
      - 'tests/test_precision_vsr.py'
      - '.github/workflows/precision-vsr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restoration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/requirements-precision-vsr.txt
      - name: Install non-generative restoration dependencies
        run: |
          python -m pip install -r tools/requirements-precision-vsr.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Test real FFmpeg clip, temporal reconstruction and scene-cut safeguards
        run: python -m unittest discover -s tests -p 'test_precision_vsr.py' -v
      - name: Test multi-reference segment-context DE-X SR
        run: python -m unittest discover -s tests -p 'test_dex_sr_conditions.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install local Canvas integration test dependencies
        run: npm ci
      - name: Verify full local Python worker to durable MP4 artifact
        timeout-minutes: 7
        env:
          DEX_SR_RUNTIME_E2E: '1'
        run: npx tsx --test tests/dex-sr-runtime.integration.test.ts
